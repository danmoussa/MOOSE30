[platformio]
default_envs = classic_esp32

[env:classic_esp32]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
upload_speed = 460800
lib_deps =
    https://github.com/pschatzmann/ESP32-A2DP.git#v1.8.10
    https://github.com/pschatzmann/arduino-audio-tools.git#v1.2.5
build_flags =
    -D CORE_DEBUG_LEVEL=1
    -D MOOSE30_DEVICE_NAME=\"MOOSE30\"
